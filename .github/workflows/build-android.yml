name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.5
          echo "GRADLE_USER_HOME=$HOME/.gradle" >> $GITHUB_ENV

      - name: Install Android SDK
        run: |
          mkdir -p /opt/android-sdk
          cd /opt/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O sdk.zip
          unzip -q sdk.zip
          mv cmdline-tools tools
          mkdir -p cmdline-tools
          mv tools cmdline-tools/
          rm sdk.zip
          echo "y" | ./cmdline-tools/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ./cmdline-tools/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1 || true
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV

      - name: Build APK
        run: gradle assembleDebug
        working-directory: ./TeleDrive-Android
        env:
          ANDROID_HOME: /opt/android-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TeleDrive-Android/app/build/outputs/apk/debug/app-debug.apk
