name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O "$RUNNER_TEMP/android-sdk-tools.zip"
          unzip -q "$RUNNER_TEMP/android-sdk-tools.zip" -d "$RUNNER_TEMP"
          cp -a "$RUNNER_TEMP/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: ./TeleDrive-Android

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TeleDrive-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
