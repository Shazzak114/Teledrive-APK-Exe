name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build EXE
        run: cargo build --release
        working-directory: ./TeleDrive-Desktop

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: TeleDrive-Desktop/target/release/teledrive-desktop.exe
          if-no-files-found: error
