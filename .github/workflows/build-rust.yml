name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build EXE
        run: cargo build --release
        working-directory: ./TeleDrive-Desktop

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: TeleDrive-Desktop/target/release/teledrive-desktop.exe
