name: Build TeleDrive Desktop EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: Build Release EXE
      run: cargo build --release
      working-directory: ./TeleDrive-Desktop

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: teleDrive-exe
        path: TeleDrive-Desktop/target/release/teledrive-desktop.exe
